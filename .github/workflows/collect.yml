name: セール商品を集める

# 毎朝 5:40（日本時間）に候補を集めて daily ブランチに置く。
# そのあと 6:10 に Claude が daily/candidates.json を読んで daily/copy.json に紹介文を書く。
on:
  schedule:
    - cron: "40 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: daily

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: これまでの紹介文と投稿の記録を取ってくる
        run: |
          mkdir -p daily state
          if git fetch -q origin state; then git show FETCH_HEAD:posted.json > state/posted.json || true; fi
          if git fetch -q origin daily; then git show FETCH_HEAD:copy.json > daily/copy.json || echo "{}" > daily/copy.json; else echo "{}" > daily/copy.json; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: セール商品を集めて投稿文の見本を作る（投稿はしない）
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python -m bot.main --preview 5 --candidates 10
      - name: daily ブランチに保存
        if: always()
        run: |
          cd daily
          git init -q -b daily
          git -c user.name=bot -c user.email=bot@users.noreply.github.com add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "collect ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" daily
